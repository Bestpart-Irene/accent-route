[project]
name = "accentroute"
version = "0.1.0"
description = "Multi-source data pipeline and weak-supervision ablation for 8-class English accent classification"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pandera>=0.24",
    "pyyaml>=6.0",
    "typer>=0.12",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    # Audio I/O and resampling: pure wheels, so CI can install them
    # (mp3/wav/flac covers Common Voice, L2-ARCTIC and EdAcc)
    "soundfile>=0.12",
    "soxr>=0.5",
]

[project.optional-dependencies]
# Heavy audio/model stacks, installed locally on demand. CI installs core + dev only,
# because CI must never download a model.
audio = [
    "silero-vad>=5.1",
    "faster-whisper>=1.0",
]
ml = [
    "torch>=2.4",
    "transformers>=4.48",
    "peft>=0.14",
    "speechbrain>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
accentroute = "accentroute.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accentroute"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
