# accent_raw → 8-class whitelist mapping, v1
#
# Keys are normalized at load time (lowercased, whitespace collapsed) before lookup; any
# value outside the table is dropped and counted (taxonomy.unmapped_counts).
# This is a deliberately conservative starting point: the T4 source ingestors report the
# top-N uncovered values, and any expansion ships as v2 (the version must increment, and
# the manifest's taxonomy_version field records which one was used).
#
# Known approximations (the datasheet has to state these plainly):
# - the official CV option "india and south asia (india, pakistan, sri lanka)" maps to
#   en-IN, which is broader than the spec's definition of Indian English — an intentional
#   approximation.
# - "canadian english", "new zealand english", "scottish english" and the like fall outside
#   the 8 classes and are deliberately left unmapped.

version: v1

mapping:
  # ── en-US ──────────────────────────────────────────────
  united states english: en-US
  american english: en-US
  us english: en-US

  # ── en-GB ──────────────────────────────────────────────
  england english: en-GB
  british english: en-GB
  southern british english: en-GB
  northern british english: en-GB
  received pronunciation: en-GB

  # ── en-AU ──────────────────────────────────────────────
  australian english: en-AU

  # ── en-IN (Indian English; native and L2 not distinguished) ──
  india and south asia (india, pakistan, sri lanka): en-IN
  indian english: en-IN

  # ── L1-Mandarin ────────────────────────────────────────
  mandarin: L1-Mandarin
  chinese: L1-Mandarin
  chinese accent: L1-Mandarin

  # ── L1-Spanish ─────────────────────────────────────────
  spanish: L1-Spanish
  spanish accent: L1-Spanish

  # ── L1-Korean ──────────────────────────────────────────
  korean: L1-Korean
  korean accent: L1-Korean

  # ── L1-Arabic ──────────────────────────────────────────
  arabic: L1-Arabic
  arabic accent: L1-Arabic
