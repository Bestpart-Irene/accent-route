# T7 dedup thresholds. sim_threshold is the pre-calibration default (deliberately
# conservative, to avoid false merges). Once real data lands, run
# scripts/calibrate_dedup.py (positives = known same-speaker pairs from L2-ARCTIC/CV,
# negatives = CV×YouTube cross-source hard negatives) and freeze the suggest_threshold
# output here.
sim_threshold: 0.45
calibrated: false        # flip to true after calibration and record the date
max_false_merge: 1.0e-3
near_duplicate:
  max_dur_delta_s: 0.5
  min_jaccard: 0.8
