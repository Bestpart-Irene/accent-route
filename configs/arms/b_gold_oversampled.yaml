# Arm B: gold-only, oversampled — the optimizer step count is exactly C's (looping over the
# smaller gold set is the oversampling). This is the control for the headline C−B number:
# it differs from C only in data content, and from A only in training budget.
arm: b_gold_oversampled
dataset_variant: a_gold        # same data as A, same budget as C
budget: step_matched_to_c
