# Training protocol shared by the three arms and LOSO — no field here may be overridden by
# an arm config (the loader enforces it).
# This is the mechanism that makes the ablation fair: same budget rule, same sampling, same
# augmentation, same checkpoint selection.
epochs_c: 15                 # budget anchor, sized on the C arm's data
batch_size: 32
lr: 1.0e-4
lr_schedule: cosine
warmup_ratio: 0.05
sampler: class_balanced      # balance classes here, not with CE class weights (no double correction)
augment:
  speed: [0.9, 1.1]
  musan: true
  rir: true
ckpt_select: best_val_macro_f1   # fixed step budget, no early stopping
seeds: [17, 42, 1337]
base_model: openai/whisper-small
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
n_classes: 8
