name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      # Core + dev dependencies only: CI must never download a model or the audio stack
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run pytest -v
